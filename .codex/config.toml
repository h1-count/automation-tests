# 官方 Chrome DevTools MCP：仅供 Codex 探索、排错与页面诊断使用。
# 版本与启动参数以 config/browser-exploration/chrome-devtools-mcp-policy.json 为准（事实源见 docs/FAST-TRACK.md「MCP 接入」）。
# 稳定步骤应随后写入 Playwright *.spec.ts，并由 npm run test:fast 重复执行。
[mcp_servers.chrome_devtools]
command = "npx"
args = [
  "-y",
  "chrome-devtools-mcp@1.6.0",
  "--no-usage-statistics",
  "--no-performance-crux",
  "--redact-network-headers=true",
  "--category-performance=false",
  "--category-emulation=false",
]
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 60

# 官方 Playwright MCP：按已审核用例探索页面，并生成 TypeScript Playwright 操作代码。
[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest", "--codegen", "typescript"]
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 60
